# REVERSE-ENGINEERED UI SPEC — Review before using
# Source: src/displayModule.cpp ~lines 2876-3192

# --- RANDOM SHORTCUT ---
screen: shortcut_random
menu_id: MENU_RANDOM
title: "Random"
display_handler: shortcutRandomMenu
notes: "Randomization parameter editor. Channel+Random button executes."

layout:
  - element: 0
    type: text
    content: "Random"
    position: [0, 0]
    size: [86, 15]
    text_size: STYLE1X

  - element: 11
    type: text
    content: "press ch+rndm"
    position: [64, 0]
    size: [63, 8]
    text_size: REGULAR1X
    color: [background, contrastColor]

  - element: 12
    type: text
    content: "to execute"
    position: [64, 8]
    size: [63, 8]
    text_size: REGULAR1X
    color: [background, contrastColor]

  - element: 1
    type: text
    content: "param:"
    position: [0, 20]
    size: [46, 17]
    text_size: STYLE1X

  - element: 5
    type: text
    content: "param name"
    position: [47, 20]
    size: [80, 17]
    text_size: STYLE1X
    highlight: STATE_SHORTCUT_RANDOM_PARAM
    binding: "globalObj->randomizeParamSelect"
    format: "[pitch+gate, pitch, gate, cv2_type, cv2_speed, cv2_amplitude, cv2_offset]"

  - element: "2,6"
    type: text
    content: "var1 label/value"
    position: "[0, 37] / [47, 37]"
    size: "[46, 17] / [80, 17]"
    highlight: STATE_SHORTCUT_RANDOM_VAR1
    binding: "varies by randomizeParamSelect"

  - element: "3,7"
    type: text
    content: "var2 label/value"
    position: "[0, 54] / [47, 54]"
    size: "[46, 17] / [80, 17]"
    highlight: STATE_SHORTCUT_RANDOM_VAR2

  - element: "4,8"
    type: text
    content: "var3 label/value"
    position: "[0, 71] / [47, 71]"
    size: "[46, 17] / [80, 17]"
    highlight: STATE_SHORTCUT_RANDOM_VAR3

