# NOTE: MENU_RESET and MENU_REVERSE are NOT screens.
# SW_05 (reset) and SW_06 (reverse) in channelButtonShortcutHandler() fire
# modal popups (MODAL_SHORTCUT_RESET / MODAL_SHORTCUT_REVERSE) directly
# without changing currentMenu. The displayModule functions shortcutResetMenu()
# and shortcutReverseMenu() exist but are never reached via the display loop
# switch because currentMenu is never set to MENU_RESET or MENU_REVERSE.

