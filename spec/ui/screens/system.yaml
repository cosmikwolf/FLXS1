# REVERSE-ENGINEERED UI SPEC — Review before using
# Source: src/displayModule.cpp

# --- SYSEX MENU ---
screen: sysex
menu_id: SYSEX_MENU
title: "sysex"
display_handler: sysexMenuHandler
notes: "SysEx import/export menu. SHIFT+PATTERN triggers export or import."

layout:
  - element: 0
    type: text
    content: "sysex"
    position: [0, 0]
    size: [128, 15]
    text_size: STYLE1X
    color: [background, contrastColor]

  - element: 1
    type: text
    content: "export/import"
    position: [0, 20]
    size: [127, 17]
    text_size: STYLE1X
    highlight: STATE_SYSEX_EXPORT
    binding: "globalObj->importExportDisplaySwitch"

---
# --- SYSEX IMPORT IN PROGRESS ---
screen: sysex_import
menu_id: SYSEX_IMPORT_INPROGRESS
title: "sysex import"
display_handler: sysexImportHandler
notes: "Shows import progress. Updates per-channel/pattern as SysEx data arrives."

layout:
  - element: 0
    type: text
    content: "sysex import"
    position: [0, 0]
    size: [128, 15]
    text_size: STYLE1X

  - element: 1
    type: text
    content: "channel: {n}"
    position: [0, 20]
    size: [127, 17]
    text_size: STYLE1X
    binding: "globalObj->sysex_channel"

  - element: 2
    type: text
    content: "pattern: {n}"
    position: [0, 37]
    size: [127, 17]
    text_size: STYLE1X
    binding: "globalObj->sysex_pattern"

  - element: 3
    type: text
    content: "status"
    position: [0, 54]
    size: [127, 17]
    text_size: STYLE1X
    binding: "globalObj->sysex_status"
    format: "[idle, preparing, readyfordata, importing, processing, importcomplete, error]"

