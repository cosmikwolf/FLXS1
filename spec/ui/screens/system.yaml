# --- CALIBRATION MENU ---
screen: calibration
menu_id: CALIBRATION_MENU
display_handler: "inputCalibrationMenuDisplay / outputCalibrationMenuDisplay / midiTestDisplay / gateTestDisplay / rheostatTestDisplay"
notes: "Calibration menu with sub-screens based on stepMode. Entered via SHIFT+PLAY+MENU or SHIFT+CHANNEL+MENU."

sub_screens:
  - condition: "stepMode < STATE_CALIB_OUTPUT0_LOW"
    handler: inputCalibrationMenuDisplay
    notes: "ADC input calibration (4 inputs x offset/low/high)"

  - condition: "stepMode == STATE_TEST_MIDI"
    handler: midiTestDisplay
    notes: "MIDI loopback test"

  - condition: "stepMode == STATE_TEST_GATES"
    handler: gateTestDisplay
    notes: "Gate output test"

  - condition: "stepMode == STATE_TEST_RHEOSTAT"
    handler: rheostatTestDisplay
    notes: "Digital potentiometer test"

  - condition: "stepMode >= STATE_CALIB_OUTPUT0_LOW"
    handler: outputCalibrationMenuDisplay
    notes: "DAC output calibration (8 outputs x low/high)"


